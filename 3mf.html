<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3MF 查看器 · Microduck 打印工程</title>
<link rel="icon" href="data:,">
<style>
 html,body{margin:0;height:100%;background:#101619;overflow:hidden;font-family:system-ui,'Microsoft YaHei',sans-serif}
 #view{position:absolute;inset:0}
 #title{position:fixed;left:14px;top:12px;color:#d7e5de;font-size:13px;letter-spacing:.08em;user-select:none}
 #nav{position:fixed;left:14px;top:34px;display:flex;gap:12px;font-size:12px;letter-spacing:.04em;user-select:none}
 #nav a{color:#7fa895;text-decoration:none}
 #nav a:hover{color:#c8ff6b}
 #nav span{color:#3a5a4e}
 #panel{position:fixed;right:12px;top:12px;display:flex;flex-direction:column;gap:8px;min-width:250px;
   background:rgba(14,20,23,.85);border:1px solid #2c443c;border-radius:10px;padding:12px 14px;backdrop-filter:blur(4px)}
 #panel button{background:#1c2a26;color:#cfe0d8;border:1px solid #3a5a4e;border-radius:6px;padding:7px 12px;
   font-size:12.5px;cursor:pointer;text-align:left;letter-spacing:.04em}
 #panel button:hover{background:#24382f}
 #panel button.primary{color:#c8ff6b;border-color:#4a7a5e}
 #info{color:#9fb3ab;font-size:11.5px;line-height:1.7;user-select:none;white-space:pre-wrap}
 #hint{position:fixed;left:14px;bottom:12px;color:#9fb3ab;font-size:12px;letter-spacing:.04em;user-select:none}
 #drop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(200,255,107,.06);
   border:2px dashed #4a7a5e;color:#c8ff6b;font-size:20px;letter-spacing:.1em;pointer-events:none}
</style></head>
<body><div id="view"></div>
<div id="title">3MF 查看器 · MICRODUCK 打印工程</div>
<div id="nav"><a href="./index.html">← 鸭子 3D 装配参考</a><span>·</span><a href="https://fanhao375.github.io/microduck-replica/wiring3d/" target="_blank" rel="noopener">fanhao375 3D 接线图 ↗</a></div>
<div id="panel">
  <button id="pick" class="primary">打开 3MF 文件…</button>
  <button id="p1">载入：kissqy 缝合怪摆盘</button>
  <button id="p2">载入：replica 飞特版 Bambu 工程</button>
  <div id="info">未载入文件
拖拽 .3mf 文件到页面即可打开</div>
</div>
<div id="hint">拖动旋转 · 滚轮缩放 · 右键平移</div>
<div id="drop">松开载入 3MF</div>
<input id="file" type="file" accept=".3mf" hidden>
<script type="module" src="./3mf.js"></script>
</body></html>
